spring:
  application:
    name: mydoc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydoc}
    username: ${DB_USERNAME:mydoc}
    password: ${DB_PASSWORD:changeme}
    hikari:
      # Cloud Run: max-instances × pool-size < Cloud SQL max_connections (DEPLOY-PLAN B4)
      maximum-pool-size: ${DB_POOL_SIZE:5}
      max-lifetime: 1700000 # Cloud SQL이 유휴 커넥션을 끊기 전에 앱이 먼저 재생성 (~28분)
  flyway:
    enabled: true
    # 프로덕션에서는 DDL 권한을 가진 마이그레이션 전용 계정을 따로 쓴다 (미지정 시 datasource 계정)
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:mydoc}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD:changeme}}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

mydoc:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
  collab-jwt-secret: ${COLLAB_JWT_SECRET:}
  editing-plane-url: ${EDITING_PLANE_URL:http://localhost:8081}
  slack:
    bot-token: ${SLACK_BOT_TOKEN:}
    app-token: ${SLACK_APP_TOKEN:}
    default-space-slug: ${SLACK_DEFAULT_SPACE_SLUG:}
    decision-cron: ${SLACK_DECISION_CRON:0 0,30 * * * *} # 지식 추출 watch 주기(기본 30분), Asia/Seoul
  meet:
    google-application-credentials: ${GOOGLE_APPLICATION_CREDENTIALS:}
    subscribed-user: ${MEET_SUBSCRIBED_USER:}
    pubsub-subscription: ${MEET_PUBSUB_SUBSCRIPTION:}
    default-space-slug: ${MEET_DEFAULT_SPACE_SLUG:}
  tiro:
    api-key: ${TIRO_API_KEY:}
  meetily:
    # Meetily 레거시 FastAPI 백엔드 주소 (예: http://localhost:5167). 비우면 기능 꺼짐.
    # 이 백엔드는 무인증이라 반드시 localhost/사내망에만 바인딩할 것 (docs/MEETILY.md).
    base-url: ${MEETILY_BASE_URL:}
  drive:
    # M7(Meet)과 같은 서비스 계정 키를 재사용한다. 다만 도메인 위임 없이, 가져올 폴더를
    # 서비스 계정 이메일에 뷰어로 직접 공유하는 방식이라 별도 관리자 설정이 필요 없다.
    google-application-credentials: ${GOOGLE_APPLICATION_CREDENTIALS:}
  document-base-url: ${MYDOC_BASE_URL:http://localhost:8080}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    chat-model: gemini-2.5-flash
    embedding-model: gemini-embedding-2
    embedding-dimensions: 1536 # matches the fixed `vector(1536)` column in V2__search.sql

management:
  endpoints:
    web:
      exposure:
        include: health
