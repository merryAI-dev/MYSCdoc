spring:
  application:
    name: mydoc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydoc}
    username: ${DB_USERNAME:mydoc}
    password: ${DB_PASSWORD:changeme}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

mydoc:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
  collab-jwt-secret: ${COLLAB_JWT_SECRET:}
  editing-plane-url: ${EDITING_PLANE_URL:http://localhost:8081}
  slack:
    bot-token: ${SLACK_BOT_TOKEN:}
    app-token: ${SLACK_APP_TOKEN:}
    default-space-slug: ${SLACK_DEFAULT_SPACE_SLUG:}
    decision-cron: ${SLACK_DECISION_CRON:0 0 18 * * *} # 의사결정 추출 잡, Asia/Seoul
  meet:
    google-application-credentials: ${GOOGLE_APPLICATION_CREDENTIALS:}
    subscribed-user: ${MEET_SUBSCRIBED_USER:}
    pubsub-subscription: ${MEET_PUBSUB_SUBSCRIPTION:}
    default-space-slug: ${MEET_DEFAULT_SPACE_SLUG:}
  tiro:
    api-key: ${TIRO_API_KEY:}
  document-base-url: ${MYDOC_BASE_URL:http://localhost:8080}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    chat-model: gemini-2.5-flash
    embedding-model: gemini-embedding-2
    embedding-dimensions: 1536 # matches the fixed `vector(1536)` column in V2__search.sql

management:
  endpoints:
    web:
      exposure:
        include: health
