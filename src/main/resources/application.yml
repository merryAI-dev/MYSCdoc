spring:
  application:
    name: mydoc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydoc}
    username: ${DB_USERNAME:mydoc}
    password: ${DB_PASSWORD:changeme}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    model:
      audio:
        speech: none
        transcription: none
      image: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-5

mydoc:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
  collab-jwt-secret: ${COLLAB_JWT_SECRET:}
  editing-plane-url: http://localhost:8081
  slack:
    bot-token: ${SLACK_BOT_TOKEN:}
    app-token: ${SLACK_APP_TOKEN:}
    default-space-slug: ${SLACK_DEFAULT_SPACE_SLUG:}
  document-base-url: ${MYDOC_BASE_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
