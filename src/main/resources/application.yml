spring:
  application:
    name: mydoc
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydoc}
    username: ${DB_USERNAME:mydoc}
    password: ${DB_PASSWORD:changeme}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  ai:
    model:
      audio:
        speech: none
        transcription: none
      chat: none
      embedding: ${SPRING_AI_MODEL_EMBEDDING:none}
      image: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      embedding:
        options:
          model: text-embedding-3-small

mydoc:
  internal-service-token: ${INTERNAL_SERVICE_TOKEN:}
  collab-jwt-secret: ${COLLAB_JWT_SECRET:}
  editing-plane-url: ${EDITING_PLANE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health
