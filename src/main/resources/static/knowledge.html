<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mydoc — 지식그래프</title>
<style>
  :root {
    --bg: #FFFFFF; --sidebar: #F7F7F5; --sidebar-hover: #EFEFEC; --soft: #F3F3F1;
    --line: #E9E9E7; --ink: #37352F; --dim: #787774; --accent: #2E75CC;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: ui-sans-serif, -apple-system, "Apple SD Gothic Neo", "Pretendard", sans-serif;
         color: var(--ink); background: var(--bg); height: 100vh; display: flex; flex-direction: column; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px; border-bottom: 1px solid var(--line); }
  header a { color: var(--dim); text-decoration: none; font-size: 14px; }
  header a:hover { color: var(--ink); }
  header h1 { font-size: 16px; font-weight: 700; }
  #q { flex: 1; max-width: 420px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px;
       background: var(--sidebar); font-size: 14px; outline: none; }
  #q:focus { background: var(--bg); border-color: var(--accent); }
  #count { font-size: 12px; color: var(--dim); }
  #legend { display: flex; gap: 10px; font-size: 12px; color: var(--dim); flex-wrap: wrap; }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
  main { flex: 1; position: relative; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  #detail { position: absolute; right: 16px; top: 16px; width: 320px; background: var(--bg);
            border: 1px solid var(--line); border-radius: 8px; padding: 14px; font-size: 13px;
            box-shadow: 0 4px 16px rgba(0,0,0,.06); display: none; }
  #detail .kind { font-size: 11px; color: var(--accent); font-weight: 600; text-transform: uppercase; }
  #detail .triple { margin: 6px 0; color: var(--dim); }
  #detail .stmt { margin-top: 6px; line-height: 1.5; }
  #emptyMsg { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
              color: var(--dim); font-size: 14px; pointer-events: none; }
  #gear { border: 1px solid var(--line); background: var(--sidebar); border-radius: 6px;
          padding: 6px 10px; font-size: 13px; cursor: pointer; }
  #gear:hover { background: var(--sidebar-hover); }
  #settings { position: absolute; left: 16px; top: 16px; width: 360px; max-height: calc(100% - 32px);
              overflow-y: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
              padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.08); display: none; font-size: 13px; }
  #settings h2 { font-size: 13px; margin: 0 0 8px; }
  #settings h2 + p { color: var(--dim); font-size: 12px; margin-bottom: 10px; line-height: 1.5; }
  #settings section + section { margin-top: 18px; border-top: 1px solid var(--line); padding-top: 14px; }
  .chRow { display: flex; align-items: center; justify-content: space-between; padding: 5px 0; gap: 8px; }
  .chRow .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chRow .lock { color: var(--dim); font-size: 11px; }
  .knob { display: flex; align-items: center; justify-content: space-between; margin: 8px 0; }
  .knob input { width: 80px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; }
  #saveSettings { margin-top: 10px; padding: 6px 14px; border: none; border-radius: 5px;
                  background: var(--accent); color: #fff; cursor: pointer; }
  #settingsMsg { color: var(--dim); font-size: 12px; margin-left: 8px; }
</style>
</head>
<body>
<header>
  <a href="/">← mydoc</a>
  <h1>지식그래프</h1>
  <input id="q" placeholder="검색 (BM25) — 예: 배포, 결제, 알림…">
  <span id="count"></span>
  <span id="legend"></span>
  <button id="gear">⚙ 설정</button>
</header>
<main>
  <canvas id="cv"></canvas>
  <div id="settings">
    <section>
      <h2>아카이빙할 채널</h2>
      <p>봇이 초대된 채널 중에서 여기서 켠 채널만 수집돼요. (초대만으로는 수집하지 않아요)</p>
      <div id="chList">불러오는 중…</div>
    </section>
    <section>
      <h2>추출 미세조정</h2>
      <p>매일 오후 6시에 조용해진 스레드를 판별해요. 아래 값으로 대상을 조절할 수 있어요.</p>
      <div class="knob"><label>스레드 침묵 기준 (분)</label><input id="quietMinutes" type="number" min="1" max="1440"></div>
      <div class="knob"><label>최소 메시지 수</label><input id="minMessages" type="number" min="1" max="100"></div>
      <button id="saveSettings">저장</button><span id="settingsMsg"></span>
    </section>
    <section>
      <h2>지금 동기화</h2>
      <p>오후 6시를 기다리지 않고, 지금까지 쌓인 조용해진 스레드를 바로 문서화해요.</p>
      <button id="syncNow">지금 동기화</button><span id="syncMsg"></span>
    </section>
  </div>
  <div id="detail"></div>
  <div id="emptyMsg" style="display:none">아직 쌓인 지식 트리플이 없어요. Slack 논의가 수집되면 여기에 나타나요.</div>
</main>
<script>
const memberId = localStorage.getItem('mydoc.memberId') || ''
const KIND_COLORS = {
  decision: '#2E75CC', policy: '#9065B0', constraint: '#D9730D',
  workaround: '#448361', gotcha: '#D44C47', convention: '#337EA9', risk: '#C14C8A',
}
const kindColor = k => KIND_COLORS[k] || '#787774'

const cv = document.getElementById('cv')
const ctx = cv.getContext('2d')
let nodes = [], edges = [], dragging = null, hoverEdge = null, hoverNode = null

function resize() {
  cv.width = cv.clientWidth * devicePixelRatio
  cv.height = cv.clientHeight * devicePixelRatio
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0)
}
window.addEventListener('resize', resize)

async function load(q) {
  const res = await fetch('/api/knowledge/graph?limit=60' + (q ? '&q=' + encodeURIComponent(q) : ''),
      { headers: { 'X-Member-Id': memberId } })
  if (!res.ok) return
  const graph = await res.json()
  const w = cv.clientWidth, h = cv.clientHeight
  const prev = new Map(nodes.map(n => [n.id, n]))
  nodes = graph.nodes.map(n => {
    const kept = prev.get(n.id)
    return { id: n.id, degree: n.degree,
             x: kept ? kept.x : w / 2 + (Math.random() - .5) * w * .6,
             y: kept ? kept.y : h / 2 + (Math.random() - .5) * h * .6,
             vx: 0, vy: 0 }
  })
  const byId = new Map(nodes.map(n => [n.id, n]))
  edges = graph.edges.map(e => ({ ...e, a: byId.get(e.source), b: byId.get(e.target) }))
  document.getElementById('count').textContent = nodes.length + '개 개체 · ' + edges.length + '개 관계'
  document.getElementById('emptyMsg').style.display = edges.length ? 'none' : 'flex'
  const kinds = [...new Set(edges.map(e => e.kind))]
  document.getElementById('legend').innerHTML = kinds.map(k =>
      '<span><span class="dot" style="background:' + kindColor(k) + '"></span>' + k + '</span>').join('')
}

// ---- force-directed layout ----
// 반발력(쿨롱): F = K_R / d²  — 모든 노드 쌍이 서로 밀어낸다
// 스프링(훅):   F = K_S · (d − L)  — 간선으로 연결된 노드는 자연길이 L로 당긴다/민다
// 중심력:       F = K_C · (중심까지의 벡터)  — 그래프가 화면 밖으로 흩어지지 않게
// 오일러 적분 + 감쇠(DAMP)로 수렴시킨다
const K_R = 6000, K_S = 0.02, L = 140, K_C = 0.015, DAMP = 0.85
function step() {
  const w = cv.clientWidth, h = cv.clientHeight
  for (const n of nodes) { n.fx = 0; n.fy = 0 }
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i + 1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j]
      let dx = a.x - b.x, dy = a.y - b.y
      let d2 = dx * dx + dy * dy || 1, d = Math.sqrt(d2)
      const f = K_R / d2
      dx /= d; dy /= d
      a.fx += f * dx; a.fy += f * dy
      b.fx -= f * dx; b.fy -= f * dy
    }
  }
  for (const e of edges) {
    if (!e.a || !e.b || e.a === e.b) continue
    let dx = e.b.x - e.a.x, dy = e.b.y - e.a.y
    const d = Math.sqrt(dx * dx + dy * dy) || 1
    const f = K_S * (d - L)
    dx /= d; dy /= d
    e.a.fx += f * dx; e.a.fy += f * dy
    e.b.fx -= f * dx; e.b.fy -= f * dy
  }
  for (const n of nodes) {
    n.fx += K_C * (w / 2 - n.x); n.fy += K_C * (h / 2 - n.y)
    if (n === dragging) continue
    n.vx = (n.vx + n.fx) * DAMP; n.vy = (n.vy + n.fy) * DAMP
    n.x += n.vx; n.y += n.vy
  }
}

function radius(n) { return 6 + 3 * Math.sqrt(n.degree) }

function draw() {
  const w = cv.clientWidth, h = cv.clientHeight
  ctx.clearRect(0, 0, w, h)
  ctx.font = '11px sans-serif'
  for (const e of edges) {
    if (!e.a || !e.b) continue
    ctx.strokeStyle = e === hoverEdge ? kindColor(e.kind) : '#E3E3E0'
    ctx.lineWidth = e === hoverEdge ? 2 : 1
    ctx.beginPath(); ctx.moveTo(e.a.x, e.a.y); ctx.lineTo(e.b.x, e.b.y); ctx.stroke()
    const mx = (e.a.x + e.b.x) / 2, my = (e.a.y + e.b.y) / 2
    ctx.fillStyle = e === hoverEdge ? kindColor(e.kind) : '#B5B5B0'
    ctx.fillText(e.predicate, mx + 4, my - 4)
  }
  for (const n of nodes) {
    const r = radius(n)
    ctx.beginPath(); ctx.arc(n.x, n.y, r, 0, Math.PI * 2)
    ctx.fillStyle = n === hoverNode ? '#2E75CC' : '#37352F'
    ctx.fill()
    ctx.fillStyle = '#37352F'
    ctx.font = n === hoverNode ? 'bold 12px sans-serif' : '12px sans-serif'
    ctx.fillText(n.id, n.x + r + 4, n.y + 4)
  }
}

function frame() { step(); draw(); requestAnimationFrame(frame) }

function pick(x, y) {
  for (const n of nodes) {
    const dx = n.x - x, dy = n.y - y
    if (dx * dx + dy * dy <= Math.pow(radius(n) + 4, 2)) return { node: n }
  }
  for (const e of edges) {
    if (!e.a || !e.b) continue
    const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y
    const len2 = dx * dx + dy * dy || 1
    const t = Math.max(0, Math.min(1, ((x - e.a.x) * dx + (y - e.a.y) * dy) / len2))
    const px = e.a.x + t * dx - x, py = e.a.y + t * dy - y
    if (px * px + py * py <= 36) return { edge: e }
  }
  return {}
}

cv.addEventListener('mousedown', ev => {
  const hit = pick(ev.offsetX, ev.offsetY)
  if (hit.node) { dragging = hit.node; cv.style.cursor = 'grabbing' }
})
cv.addEventListener('mousemove', ev => {
  if (dragging) { dragging.x = ev.offsetX; dragging.y = ev.offsetY; dragging.vx = 0; dragging.vy = 0; return }
  const hit = pick(ev.offsetX, ev.offsetY)
  hoverNode = hit.node || null
  hoverEdge = hit.edge || null
  cv.style.cursor = (hoverNode || hoverEdge) ? 'pointer' : 'grab'
  const detail = document.getElementById('detail')
  if (hoverEdge) {
    detail.style.display = 'block'
    // 트리플 값은 Slack/LLM 추출물이라 신뢰할 수 없다 — textContent로만 넣어 XSS를 막는다.
    detail.textContent = ''
    const kind = document.createElement('div'); kind.className = 'kind'; kind.textContent = hoverEdge.kind
    const triple = document.createElement('div'); triple.className = 'triple'
    triple.textContent = hoverEdge.source + ' — ' + hoverEdge.predicate + ' — ' + hoverEdge.target
    const stmt = document.createElement('div'); stmt.className = 'stmt'; stmt.textContent = hoverEdge.statement
    detail.append(kind, triple, stmt)
  } else if (!hoverNode) {
    detail.style.display = 'none'
  }
})
cv.addEventListener('mouseup', () => { dragging = null; cv.style.cursor = 'grab' })

let debounce
document.getElementById('q').addEventListener('input', ev => {
  clearTimeout(debounce)
  debounce = setTimeout(() => load(ev.target.value.trim()), 300)
})

// ---- 설정 패널: 채널 옵트인 + 추출 미세조정 ----
const api = (path, opts = {}) => fetch(path, {
  ...opts,
  headers: { 'X-Member-Id': memberId, ...(opts.body ? { 'Content-Type': 'application/json' } : {}) },
})
const settingsEl = document.getElementById('settings')
document.getElementById('gear').onclick = () => {
  const open = settingsEl.style.display === 'block'
  settingsEl.style.display = open ? 'none' : 'block'
  if (!open) { loadChannels(); loadSettings() }
}

async function loadChannels() {
  const list = document.getElementById('chList')
  try {
    const res = await api('/api/slack/channels')
    if (!res.ok) throw new Error()
    const { channels } = await res.json()
    if (!channels.length) { list.textContent = '봇이 초대된 채널이 없어요. Slack에서 채널에 봇을 초대해 주세요.'; return }
    list.innerHTML = ''
    for (const ch of channels) {
      const row = document.createElement('div')
      row.className = 'chRow'
      const name = document.createElement('span')
      name.className = 'nm'
      name.textContent = (ch.isPrivate ? '🔒 ' : '# ') + ch.channelName
      const toggle = document.createElement('input')
      toggle.type = 'checkbox'
      toggle.checked = ch.archiveEnabled
      toggle.onchange = async () => {
        toggle.disabled = true
        const res = await api('/api/slack/channels/' + ch.channelId, {
          method: 'PUT',
          body: JSON.stringify({ enabled: toggle.checked, channelName: ch.channelName }),
        })
        if (!res.ok) toggle.checked = !toggle.checked
        toggle.disabled = false
      }
      row.append(name, toggle)
      list.appendChild(row)
    }
  } catch { list.textContent = '채널 목록을 불러오지 못했어요 (Slack 연동 확인 필요).' }
}

async function loadSettings() {
  const res = await api('/api/knowledge/settings')
  if (!res.ok) return
  const s = await res.json()
  document.getElementById('quietMinutes').value = s.quietMinutes
  document.getElementById('minMessages').value = s.minMessages
}
document.getElementById('saveSettings').onclick = async () => {
  const msg = document.getElementById('settingsMsg')
  const res = await api('/api/knowledge/settings', {
    method: 'PUT',
    body: JSON.stringify({
      quietMinutes: Number(document.getElementById('quietMinutes').value),
      minMessages: Number(document.getElementById('minMessages').value),
    }),
  })
  msg.textContent = res.ok ? '저장됐어요 — 다음 오후 6시 실행부터 적용돼요.' : '저장에 실패했어요.'
  setTimeout(() => { msg.textContent = '' }, 4000)
}

document.getElementById('syncNow').onclick = async ev => {
  const btn = ev.target, msg = document.getElementById('syncMsg')
  btn.disabled = true; msg.textContent = '동기화 중… (Gemini 추출은 시간이 걸려요)'
  try {
    const res = await api('/api/knowledge/sync', { method: 'POST' })
    if (!res.ok) throw new Error()
    const r = await res.json()
    msg.textContent = !r.started
        ? '이미 동기화가 돌고 있어요.'
        : '스레드 ' + r.examined + '개 확인, 문서 ' + r.documented + '건 갱신했어요.'
    load(document.getElementById('q').value.trim()) // 그래프 새로고침
  } catch { msg.textContent = '동기화에 실패했어요.' }
  finally { btn.disabled = false; setTimeout(() => { msg.textContent = '' }, 6000) }
}

resize()
load('')
frame()
</script>
</body>
</html>
