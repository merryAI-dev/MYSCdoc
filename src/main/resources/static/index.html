<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mydoc</title>
<style>
  :root {
    --bg: #FFFFFF; --sidebar: #F7F7F5; --sidebar-hover: #EFEFEC; --soft: #F3F3F1;
    --ink: #2F2F2D; --muted: #787774; --faint: #A8A8A5; --line: #E7E6E3;
    --accent: #0F7B6C; --danger: #B42318; --warn: #9A6A12;
    --sans: -apple-system, 'Apple SD Gothic Neo', 'Pretendard', 'Malgun Gothic', sans-serif;
    --mono: ui-monospace, 'SF Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: var(--sans); background: var(--bg); color: var(--ink); height: 100vh; overflow: hidden; }
  button { font-family: inherit; cursor: pointer; }
  input { font-family: inherit; }

  /* ---------- login ---------- */
  #login { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; gap: 12px; padding: 24px; }
  #login h1 { font-weight: 700; font-size: 40px; letter-spacing: 0; }
  #login p { color: var(--muted); font-size: 14px; }
  #login input { width: min(340px, 100%); padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: #fff; font-family: var(--mono); font-size: 13px; }
  #login input:focus { outline: 2px solid rgba(15,123,108,.18); border-color: var(--accent); }
  #login button { padding: 9px 20px; border: none; border-radius: 4px; background: var(--ink); color: #fff; font-size: 14px; }
  #login .err { color: var(--danger); font-size: 13px; min-height: 18px; }

  /* ---------- shell ---------- */
  #app { display: none; height: 100vh; }
  #app.on { display: flex; }
  aside { width: 284px; min-width: 284px; border-right: 1px solid var(--line); background: var(--sidebar); display: flex; flex-direction: column; }
  aside .brand { font-weight: 650; font-size: 15px; padding: 14px 14px 8px; }
  aside .me { padding: 0 14px 12px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  aside .me button { background: none; border: none; color: var(--muted); font-size: 12px; padding: 0; }
  aside .me button:hover { color: var(--ink); }
  #searchWrap { padding: 0 8px 8px; position: relative; }
  #searchWrap input { width: 100%; padding: 7px 9px; border: 1px solid transparent; border-radius: 4px; background: var(--soft); font-size: 13px; }
  #searchWrap input:focus { outline: none; border-color: var(--line); background: #fff; }
  #searchResults { position: absolute; left: 8px; right: 8px; top: 36px; background: #fff; border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 12px 30px rgba(0,0,0,.10); z-index: 30; max-height: 320px; overflow: auto; display: none; }
  #searchResults .hit { padding: 9px 10px; font-size: 13px; cursor: pointer; border-bottom: 1px solid var(--soft); }
  #searchResults .hit:hover { background: var(--sidebar); }
  #searchResults .hit .path { font-size: 11px; color: var(--muted); margin-bottom: 2px; }
  #knowledgeLink { display: block; margin: 0 8px 4px; padding: 6px 8px; border-radius: 4px; font-size: 13px; color: var(--muted); text-decoration: none; }
  #knowledgeLink:hover { background: var(--sidebar-hover); color: var(--ink); }
  #tiroImport, #driveImport, #driveSyncKnowledge { display: block; width: calc(100% - 16px); margin: 0 8px 6px; padding: 6px 8px; border-radius: 4px; font-size: 13px; color: var(--muted); background: none; border: none; text-align: left; cursor: pointer; }
  #tiroImport:hover, #driveImport:hover, #driveSyncKnowledge:hover { background: var(--sidebar-hover); color: var(--ink); }
  nav { flex: 1; overflow-y: auto; padding: 4px 8px 16px; }
  .spaceRow { display: flex; align-items: center; justify-content: space-between; padding: 12px 8px 4px; font-size: 11px; font-weight: 650; color: var(--muted); letter-spacing: 0; }
  .docRow { display: flex; align-items: center; gap: 7px; padding: 5px 8px; min-height: 30px; border-radius: 4px; font-size: 14px; cursor: pointer; color: var(--ink); }
  .docRow::before { content: "□"; color: var(--faint); font-size: 11px; flex-shrink: 0; }
  .docRow:hover { background: var(--sidebar-hover); }
  .docRow.active { background: #E9E9E6; font-weight: 550; }
  .docRow .st { font-size: 10px; padding: 1px 5px; border-radius: 3px; flex-shrink: 0; background: #fff; color: var(--muted); border: 1px solid var(--line); }
  .st.DRAFT { color: var(--muted); }
  .st.STALE { color: var(--warn); border-color: rgba(154,106,18,.28); background: rgba(154,106,18,.08); }
  .newDoc { margin: 3px 0; padding: 6px 8px; width: 100%; text-align: left; background: none; border: none; border-radius: 4px; color: var(--muted); font-size: 13px; }
  .newDoc:hover { background: var(--sidebar-hover); color: var(--ink); }

  /* ---------- main ---------- */
  main { flex: 1; overflow-y: auto; position: relative; }
  #empty { display: flex; height: 100%; align-items: center; justify-content: center; color: var(--muted); font-size: 15px; }
  #docView { display: none; max-width: 820px; margin: 0 auto; padding: 72px 72px 120px; }
  #staleBanner { display: none; margin-bottom: 24px; padding: 9px 12px; border: 1px solid rgba(154,106,18,.28); border-radius: 4px; background: rgba(154,106,18,.06); color: var(--warn); font-size: 13px; align-items: center; justify-content: space-between; gap: 12px; }
  #staleBanner button { border: 1px solid rgba(154,106,18,.35); background: #fff; color: var(--warn); border-radius: 4px; padding: 4px 10px; font-size: 12px; white-space: nowrap; }
  .docHead { display: flex; align-items: flex-start; gap: 16px; }
  #docTitle { font-weight: 700; font-size: 40px; line-height: 1.18; letter-spacing: 0; flex: 1; outline: none; border-radius: 4px; padding: 2px 0; }
  #docTitle:empty::before { content: "제목 없음"; color: var(--faint); }
  #docTitle:focus { background: var(--sidebar); }

  /* 검증 도장 — signature element */
  #stamp { flex-shrink: 0; display: none; align-items: center; justify-content: center; margin-top: 8px;
    border: 1px solid rgba(15,123,108,.22); border-radius: 999px; padding: 3px 8px;
    font-size: 12px; color: var(--accent); background: rgba(15,123,108,.07); }
  #stamp.on { display: inline-flex; }

  .metaRow { display: flex; align-items: center; gap: 12px; margin: 12px 0 8px; font-size: 12px; color: var(--muted); font-family: var(--mono); flex-wrap: wrap; }
  #freshness { display: flex; align-items: center; gap: 6px; }
  #freshBar { width: 70px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  #freshBar i { display: block; height: 100%; background: var(--accent); }
  #freshBar i.warn { background: var(--warn); }
  .actions { display: flex; gap: 6px; margin: 14px 0 34px; flex-wrap: wrap; }
  .actions button { padding: 5px 10px; font-size: 13px; border: 1px solid var(--line); background: #fff; border-radius: 4px; color: var(--ink); }
  .actions button:hover { background: var(--sidebar); }
  #saveState { margin-left: auto; font-size: 12px; color: var(--muted); align-self: center; font-family: var(--mono); }

  /* ---------- editor ---------- */
  #editor .tiptap { outline: none; min-height: 360px; font-size: 16px; line-height: 1.72; }
  #editor .tiptap > * + * { margin-top: .5em; }
  #editor h1, #editor h2, #editor h3 { font-weight: 650; letter-spacing: 0; margin-top: 1.35em; }
  #editor h1 { font-size: 28px; } #editor h2 { font-size: 22px; } #editor h3 { font-size: 18px; }
  #editor p.is-editor-empty:first-child::before { color: var(--faint); content: "문서를 입력하세요."; float: left; height: 0; pointer-events: none; }
  #editor blockquote { border-left: 3px solid var(--line); padding-left: 14px; color: var(--muted); }
  #editor pre { background: var(--soft); color: var(--ink); padding: 14px 16px; border-radius: 4px; font-family: var(--mono); font-size: 13.5px; overflow-x: auto; }
  #editor code { font-family: var(--mono); font-size: .9em; }
  #editor ul, #editor ol { padding-left: 1.4em; }
  #editor table { border-collapse: collapse; width: 100%; }
  #editor td, #editor th { border: 1px solid var(--line); padding: 6px 10px; font-size: 14.5px; }
  #editor th { background: var(--sidebar); }
  #editor img { max-width: 100%; border-radius: 4px; }

  /* ---------- panels / toast ---------- */
  #panel { position: fixed; right: 0; top: 0; bottom: 0; width: min(380px, 100vw); background: #fff; border-left: 1px solid var(--line);
    box-shadow: -12px 0 30px rgba(0,0,0,.08); transform: translateX(100%); transition: transform .18s ease; z-index: 40;
    display: flex; flex-direction: column; }
  #panel.open { transform: none; }
  #panel header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px; border-bottom: 1px solid var(--line); font-weight: 650; }
  #panel header button { border: none; background: none; font-size: 18px; color: var(--muted); }
  #panelBody { flex: 1; overflow-y: auto; padding: 14px 18px; font-size: 13.5px; }
  .finding { border: 1px solid var(--line); border-radius: 4px; padding: 12px; margin-bottom: 10px; }
  .finding .cat { font-size: 11px; font-family: var(--mono); color: var(--muted); margin-bottom: 6px; }
  .finding .orig { text-decoration: line-through; color: var(--muted); }
  .finding .sugg { color: var(--ink); font-weight: 600; }
  .finding .why { margin-top: 6px; color: var(--muted); font-size: 12.5px; }
  .revRow { padding: 9px 2px; border-bottom: 1px solid var(--soft); font-family: var(--mono); font-size: 12px; color: var(--muted); }
  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 9px 14px; border-radius: 4px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 50; }
  #toast.on { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { #panel { transition: none; } }
  @media (max-width: 720px) {
    aside { width: 40vw; min-width: 172px; }
    #docView { padding: 40px 22px 80px; }
    #docTitle { font-size: 32px; }
    .actions button { padding: 5px 8px; }
  }
  @media (max-width: 520px) {
    #app.on { display: block; overflow: auto; }
    aside { width: 100%; min-width: 0; max-height: 38vh; border-right: 0; border-bottom: 1px solid var(--line); }
    main { height: 62vh; }
    #docView { padding: 28px 18px 72px; }
  }
</style>
</head>
<body>

<div id="login">
  <h1>mydoc</h1>
  <p>사내 문서를 조용히 정리하는 공간</p>
  <input id="loginId" placeholder="00000000-0000-0000-0000-000000000000" spellcheck="false">
  <div class="err" id="loginErr"></div>
  <button id="loginBtn">들어가기</button>
</div>

<div id="app">
  <aside>
    <div class="brand">mydoc</div>
    <div class="me"><span id="meName"></span><button id="logout">나가기</button></div>
    <div id="searchWrap">
      <input id="search" placeholder="문서 검색…">
      <div id="searchResults"></div>
    </div>
    <a id="knowledgeLink" href="/knowledge.html">🕸 지식그래프</a>
    <button id="tiroImport">⇩ Tiro에서 가져오기</button>
    <button id="driveImport">⇩ Google Drive에서 가져오기</button>
    <button id="driveSyncKnowledge">🔗 지식그래프 동기화 (Drive·Tiro)</button>
    <nav id="nav"></nav>
  </aside>
  <main>
    <div id="empty">왼쪽에서 문서를 선택하거나, 새 문서를 만들어보세요.</div>
    <div id="docView">
      <div id="staleBanner"><span>이 문서는 오래됐어요. 내용이 아직 유효한지 확인해 주세요.</span><button id="staleVerify">지금 검증</button></div>
      <div class="docHead">
        <h1 id="docTitle" contenteditable="true" spellcheck="false"></h1>
        <div id="stamp">검증</div>
      </div>
      <div class="metaRow">
        <span id="metaOwner"></span>
        <span id="metaStatus"></span>
        <span id="freshness"><span id="freshLabel"></span><span id="freshBar"><i></i></span></span>
      </div>
      <div class="actions">
        <button id="btnVerify">검증하기</button>
        <button id="btnCorrect">AI 교정</button>
        <button id="btnRevs">리비전</button>
        <button id="btnArchive">보관</button>
        <span id="saveState"></span>
      </div>
      <div id="editor"></div>
    </div>
  </main>
</div>

<div id="panel">
  <header><span id="panelTitle"></span><button id="panelClose">✕</button></header>
  <div id="panelBody"></div>
</div>
<div id="toast"></div>

<script type="module">
import { Editor } from 'https://esm.sh/@tiptap/core@2.14.0'
import StarterKit from 'https://esm.sh/@tiptap/starter-kit@2.14.0'
import Image from 'https://esm.sh/@tiptap/extension-image@2.14.0'
import Table from 'https://esm.sh/@tiptap/extension-table@2.14.0'
import TableRow from 'https://esm.sh/@tiptap/extension-table-row@2.14.0'
import TableCell from 'https://esm.sh/@tiptap/extension-table-cell@2.14.0'
import TableHeader from 'https://esm.sh/@tiptap/extension-table-header@2.14.0'

// ---------- state ----------
const $ = id => document.getElementById(id)
let memberId = localStorage.getItem('mydoc.memberId') || ''
let me = null, spaces = [], docsBySpace = {}, currentDoc = null, editor = null
let dirty = false, saveTimer = null, saving = false

// ---------- api ----------
async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: { 'X-Member-Id': memberId, ...(body ? { 'Content-Type': 'application/json' } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  })
  if (res.status === 204) return null
  const json = await res.json().catch(() => null)
  if (!res.ok) throw new Error(json?.detail || `${res.status} 오류`)
  return json
}
function toast(msg) {
  $('toast').textContent = msg
  $('toast').classList.add('on')
  clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('on'), 2400)
}

// ---------- block mapping (editing-plane server.js와 동일 규칙) ----------
function blockType(node) {
  if (node.type === 'heading') return ['HEADING1','HEADING2','HEADING3'][Math.min((node.attrs?.level || 1), 3) - 1]
  return { paragraph:'PARAGRAPH', bulletList:'BULLET_LIST', orderedList:'ORDERED_LIST',
           codeBlock:'CODE', table:'TABLE', blockquote:'QUOTE', image:'IMAGE' }[node.type] || 'PARAGRAPH'
}
const docToBlocks = json => (json.content || []).map(node => ({ type: blockType(node), content: node, sourceType: 'MANUAL' }))
const blocksToDoc = blocks => ({ type: 'doc', content: blocks.length ? blocks.map(b => b.content) : [{ type: 'paragraph' }] })

// ---------- login ----------
async function tryLogin(id) {
  memberId = id.trim()
  me = await api('GET', '/api/members/me')
  localStorage.setItem('mydoc.memberId', memberId)
  $('login').style.display = 'none'
  $('app').classList.add('on')
  $('meName').textContent = `${me.displayName} · ${me.role}`
  await loadNav()
}
$('loginBtn').onclick = () => tryLogin($('loginId').value).catch(e => $('loginErr').textContent = e.message)
$('loginId').addEventListener('keydown', e => { if (e.key === 'Enter') $('loginBtn').click() })
$('logout').onclick = () => { localStorage.removeItem('mydoc.memberId'); location.reload() }

// ---------- sidebar ----------
async function loadNav() {
  const nav = $('nav')
  try {
    spaces = await api('GET', '/api/spaces')
  } catch (e) {
    // 부팅 중 조용히 죽지 않도록 — 서버 문제와 로그인 문제를 구분해 보여준다
    nav.innerHTML = '<div class="spaceRow">문서 목록을 불러오지 못했어요</div>'
    toast('서버 연결을 확인해 주세요: ' + e.message)
    return
  }
  nav.innerHTML = ''
  for (const space of spaces) {
    const head = document.createElement('div')
    head.className = 'spaceRow'; head.textContent = space.name
    nav.appendChild(head)
    const page = await api('GET', `/api/documents?spaceId=${space.id}&page=0&size=100`)
    docsBySpace[space.id] = page.content
    for (const doc of page.content) nav.appendChild(docRow(doc))
    const add = document.createElement('button')
    add.className = 'newDoc'; add.textContent = '＋ 새 문서'
    add.onclick = async () => {
      const created = await api('POST', '/api/documents', { spaceId: space.id, title: '제목 없음' }).catch(e => toast(e.message))
      if (created) { await loadNav(); openDoc(created.id) }
    }
    nav.appendChild(add)
  }
  if (me.role === 'ADMIN') {
    const add = document.createElement('button')
    add.className = 'newDoc'; add.textContent = '＋ 새 스페이스'
    add.onclick = async () => {
      const name = prompt('스페이스 이름'); if (!name) return
      const slug = prompt('slug (영문 소문자/하이픈)'); if (!slug) return
      await api('POST', '/api/spaces', { slug, name }).then(loadNav).catch(e => toast(e.message))
    }
    nav.appendChild(add)
  }
}
function docRow(doc) {
  const row = document.createElement('div')
  row.className = 'docRow'; row.dataset.docId = doc.id
  if (currentDoc?.id === doc.id) row.classList.add('active')
  const title = document.createElement('span'); title.textContent = doc.title; title.style.cssText = 'overflow:hidden;text-overflow:ellipsis;white-space:nowrap'
  row.appendChild(title)
  if (doc.status !== 'ACTIVE') { const st = document.createElement('span'); st.className = 'st ' + doc.status; st.textContent = doc.status; row.appendChild(st) }
  row.onclick = () => openDoc(doc.id)
  return row
}

// ---------- document ----------
async function openDoc(id) {
  await flushSave()
  currentDoc = await api('GET', `/api/documents/${id}`)
  $('empty').style.display = 'none'
  $('docView').style.display = 'block'
  document.querySelectorAll('.docRow').forEach(r => r.classList.toggle('active', r.dataset.docId === id))
  $('docTitle').textContent = currentDoc.title
  renderMeta()
  if (editor) editor.destroy()
  editor = new Editor({
    element: $('editor'),
    extensions: [StarterKit, Image, Table, TableRow, TableCell, TableHeader],
    content: blocksToDoc(currentDoc.blocks),
    onUpdate: () => { dirty = true; $('saveState').textContent = '수정됨'; clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 3000) },
  })
  $('saveState').textContent = ''
}
function renderMeta() {
  const doc = currentDoc
  $('metaOwner').textContent = `owner ${doc.owner.displayName}`
  $('metaStatus').textContent = doc.status
  $('staleBanner').style.display = doc.status === 'STALE' ? 'flex' : 'none'
  // 신선도: verifiedAt(없으면 createdAt) + ttlDays 기준 D-day
  const base = new Date(doc.verifiedAt || doc.createdAt)
  const expires = new Date(base.getTime() + doc.ttlDays * 86400000)
  const daysLeft = Math.ceil((expires - Date.now()) / 86400000)
  const ratio = Math.max(0, Math.min(1, daysLeft / doc.ttlDays))
  $('freshLabel').textContent = daysLeft > 0 ? `신선도 D-${daysLeft}` : '기한 지남'
  const bar = $('freshBar').firstElementChild
  bar.style.width = (ratio * 100) + '%'
  bar.className = ratio < .25 ? 'warn' : ''
  $('stamp').classList.toggle('on', Boolean(doc.verifiedAt) && doc.status === 'ACTIVE')
}
async function flushSave() {
  if (!dirty || !currentDoc || saving) return
  saving = true; dirty = false
  $('saveState').textContent = '저장 중…'
  try {
    await api('PUT', `/api/documents/${currentDoc.id}/blocks`, { blocks: docToBlocks(editor.getJSON()) })
    currentDoc = await api('GET', `/api/documents/${currentDoc.id}`)
    renderMeta()
    $('saveState').textContent = '저장됨'
  } catch (e) { dirty = true; $('saveState').textContent = '저장 실패'; toast(e.message) }
  saving = false
}
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 's') { e.preventDefault(); flushSave() }
})
window.addEventListener('beforeunload', () => { if (dirty) navigator.sendBeacon && flushSave() })

// title
$('docTitle').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); e.target.blur() } })
$('docTitle').addEventListener('blur', async e => {
  const title = e.target.textContent.trim() || '제목 없음'
  if (!currentDoc || title === currentDoc.title) return
  currentDoc = await api('PUT', `/api/documents/${currentDoc.id}/title`, { title }).catch(err => (toast(err.message), currentDoc))
  loadNav()
})

// actions
async function verifyNow() {
  await api('POST', `/api/documents/${currentDoc.id}/verify`).catch(e => { throw e })
  currentDoc = await api('GET', `/api/documents/${currentDoc.id}`)
  renderMeta(); loadNav(); toast('검증 도장을 찍었어요')
}
$('btnVerify').onclick = () => verifyNow().catch(e => toast(e.message))
$('staleVerify').onclick = () => verifyNow().catch(e => toast(e.message))
$('btnArchive').onclick = async () => {
  if (!confirm('이 문서를 보관할까요? 목록에서 숨겨져요.')) return
  await api('POST', `/api/documents/${currentDoc.id}/archive`).catch(e => toast(e.message))
  currentDoc = null; $('docView').style.display = 'none'; $('empty').style.display = 'flex'
  loadNav()
}
$('btnCorrect').onclick = async () => {
  openPanel('AI 교정')
  $('panelBody').innerHTML = '<p style="color:var(--muted)">Gemini가 문서를 읽고 있어요…</p>'
  try {
    const r = await api('POST', `/api/documents/${currentDoc.id}/corrections`)
    $('panelBody').innerHTML = `<p style="margin-bottom:12px">문서 점수 <b>${r.score}</b> / 100</p>` +
      (r.findings.length ? r.findings.map(f =>
        `<div class="finding"><div class="cat">${f.category} · 블록 ${f.blockPosition}</div>
         <div class="orig">${esc(f.original)}</div><div class="sugg">→ ${esc(f.suggestion)}</div>
         <div class="why">${esc(f.reason)}</div></div>`).join('')
       : '<p style="color:var(--muted)">고칠 곳을 찾지 못했어요.</p>')
  } catch (e) { $('panelBody').innerHTML = `<p style="color:var(--danger)">${esc(e.message)}</p>` }
}
$('btnRevs').onclick = async () => {
  openPanel('리비전 이력')
  const page = await api('GET', `/api/documents/${currentDoc.id}/revisions?page=0&size=30`).catch(e => (toast(e.message), { content: [] }))
  $('panelBody').innerHTML = page.content.map(r =>
    `<div class="revRow">${new Date(r.createdAt).toLocaleString('ko-KR')} · ${esc(r.editorName || '?')} · ${r.cause}</div>`
  ).join('') || '<p style="color:var(--muted)">이력이 없어요.</p>'
}
function openPanel(title) { $('panelTitle').textContent = title; $('panel').classList.add('open') }
$('panelClose').onclick = () => $('panel').classList.remove('open')
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]))

// ---------- Tiro 가져오기 ----------
let tiroSearchTimer = null
$('tiroImport').onclick = () => openTiroPicker()
function openTiroPicker() {
  if (!spaces.length) { toast('먼저 스페이스를 만들어 주세요'); return }
  openPanel('Tiro에서 가져오기')
  // 어느 스페이스에 넣을지 상단에서 한 번만 고른다.
  $('panelBody').innerHTML = `
    <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px">가져올 스페이스</label>
    <select id="tiroSpace" style="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:4px;font-size:13px;margin-bottom:10px">
      ${spaces.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
    </select>
    <input id="tiroSearch" placeholder="회의 제목으로 검색…" style="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:4px;font-size:13px;margin-bottom:10px">
    <div id="tiroList"></div>
  `
  const input = $('tiroSearch')
  input.addEventListener('input', () => {
    clearTimeout(tiroSearchTimer)
    tiroSearchTimer = setTimeout(() => loadTiroNotes(input.value.trim()), 300)
  })
  loadTiroNotes('')
}
async function loadTiroNotes(keyword) {
  const list = $('tiroList')
  list.innerHTML = '<p style="color:var(--muted)">불러오는 중…</p>'
  let notes
  try {
    notes = await api('GET', `/api/integrations/tiro/notes${keyword ? '?keyword=' + encodeURIComponent(keyword) : ''}`)
  } catch (e) { list.innerHTML = `<p style="color:var(--danger)">${esc(e.message)}</p>`; return }
  if (!notes.length) { list.innerHTML = '<p style="color:var(--muted)">회의록이 없어요.</p>'; return }
  list.innerHTML = notes.map(n => `
    <div class="finding" data-guid="${n.guid}">
      <div style="font-weight:600;margin-bottom:4px">${esc(n.title)}</div>
      <div class="cat">${n.createdAt ? new Date(n.createdAt).toLocaleDateString('ko-KR') : ''}${n.recordingDurationSeconds ? ' · ' + Math.round(n.recordingDurationSeconds / 60) + '분' : ''}</div>
      ${tiroPeople(n) ? `<div class="cat">${esc(tiroPeople(n))}</div>` : ''}
      <button data-import="${n.guid}" style="margin-top:8px;padding:5px 10px;font-size:12.5px;border:1px solid var(--line);background:#fff;border-radius:4px">가져오기</button>
    </div>
  `).join('')
  list.querySelectorAll('[data-import]').forEach(btn => btn.onclick = () => importTiroNote(btn.dataset.import, btn))
}
function tiroPeople(note) {
  const owner = (note.collaborators || []).find(p => p.role === 'OWNER')
  const participants = (note.participants || []).map(p => p.name || p.email).filter(Boolean).slice(0, 3).join(', ')
  return [owner && `작성자 ${owner.name || owner.email}`, participants && `참석자 ${participants}`].filter(Boolean).join(' · ')
}
async function importTiroNote(noteGuid, btn) {
  const spaceId = $('tiroSpace').value
  btn.disabled = true; btn.textContent = '가져오는 중…'
  try {
    const r = await api('POST', `/api/integrations/tiro/notes/${noteGuid}/import`, { spaceId })
    $('panel').classList.remove('open')
    toast('Tiro 회의록을 가져왔어요')
    await loadNav()
    openDoc(r.documentId)
  } catch (e) { btn.disabled = false; btn.textContent = '가져오기'; toast(e.message) }
}

// ---------- Google Drive 회의록 마이그레이션 (일회성) ----------
$('driveImport').onclick = () => openDrivePicker()
function openDrivePicker() {
  if (!spaces.length) { toast('먼저 스페이스를 만들어 주세요'); return }
  openPanel('Google Drive에서 가져오기')
  $('panelBody').innerHTML = `
    <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px">가져올 스페이스</label>
    <select id="driveSpace" style="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:4px;font-size:13px;margin-bottom:10px">
      ${spaces.map(s => `<option value="${s.id}">${esc(s.name)}</option>`).join('')}
    </select>
    <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:4px">회의록 폴더 링크 또는 ID</label>
    <input id="driveFolder" placeholder="https://drive.google.com/drive/folders/…" style="width:100%;padding:7px 9px;border:1px solid var(--line);border-radius:4px;font-size:13px;margin-bottom:10px">
    <p style="font-size:12px;color:var(--muted);margin-bottom:10px">이 폴더를 서비스 계정 이메일에 "뷰어"로 미리 공유해 두어야 해요. 네이티브 Google Docs만 가져와요(하위 폴더 포함).</p>
    <button id="driveBrowse" style="padding:6px 14px;border:1px solid var(--line);background:#fff;border-radius:5px">폴더 확인</button>
    <span id="driveMsg" style="font-size:12px;color:var(--muted);margin-left:8px"></span>
    <div id="driveList" style="margin-top:12px"></div>
  `
  $('driveBrowse').onclick = browseDriveFolder
}
function driveFolderId() {
  const raw = $('driveFolder').value.trim()
  const m = raw.match(/folders\/([a-zA-Z0-9_-]+)/)
  return m ? m[1] : raw
}
async function browseDriveFolder() {
  const folderId = driveFolderId()
  const msg = $('driveMsg'), list = $('driveList')
  if (!folderId) { msg.textContent = '폴더 링크나 ID를 입력해 주세요.'; return }
  msg.textContent = '확인 중…'; list.innerHTML = ''
  try {
    const r = await api('POST', '/api/integrations/drive/browse', { folderId })
    if (!r.docs.length) { msg.textContent = '이 폴더에서 Google Docs를 찾지 못했어요 (공유 설정을 확인해 주세요).'; return }
    msg.textContent = `${r.docs.length}개 문서를 찾았어요.`
    list.innerHTML = `
      <ul style="max-height:220px;overflow-y:auto;margin:0 0 10px;padding-left:18px;font-size:13px;color:var(--muted)">
        ${r.docs.slice(0, 50).map(d => `<li>${esc(d.name)}</li>`).join('')}
        ${r.docs.length > 50 ? `<li>… 외 ${r.docs.length - 50}개</li>` : ''}
      </ul>
      <button id="driveImportAll" style="padding:6px 14px;border:none;background:var(--accent, #2E75CC);color:#fff;border-radius:5px">전체 가져오기</button>
    `
    $('driveImportAll').onclick = () => importDriveFolder(folderId)
  } catch (e) { msg.textContent = e.message }
}
let drivePollTimer = null
async function importDriveFolder(folderId) {
  const spaceId = $('driveSpace').value
  const btn = $('driveImportAll'), msg = $('driveMsg')
  btn.disabled = true; btn.textContent = '가져오는 중…'
  try {
    // 임포트는 문서당 수 초씩 걸리는 백그라운드 잡 — 시작만 하고 진행상황을 폴링한다.
    await api('POST', '/api/integrations/drive/import', { folderId, spaceId })
    pollDriveImport()
  } catch (e) { btn.disabled = false; btn.textContent = '전체 가져오기'; msg.textContent = e.message }
}
function pollDriveImport() {
  clearTimeout(drivePollTimer)
  drivePollTimer = setTimeout(async () => {
    const btn = $('driveImportAll'), msg = $('driveMsg')
    try {
      const j = await api('GET', '/api/integrations/drive/import/status')
      if (j.status === 'RUNNING') {
        if (msg) msg.textContent = `진행 중 ${j.processed}/${j.found}… ${j.currentDoc ? '(' + j.currentDoc + ')' : ''}`
        pollDriveImport()
        return
      }
      if (msg) {
        msg.textContent = j.status === 'FAILED'
            ? `실패: ${j.error || '알 수 없는 오류'}`
            : `완료: ${j.found}개 중 ${j.imported}개 가져옴(그중 지식추출 ${j.documented}건), 건너뜀 ${j.skippedDuplicate}개, 실패 ${j.failed}개.`
      }
      if (btn) { btn.disabled = false; btn.textContent = '전체 가져오기' }
      await loadNav()
    } catch { pollDriveImport() /* 일시적 네트워크 오류면 계속 폴링 */ }
  }, 2000)
}

// 이미 가져온 Drive 문서들을 다시 훑어 지식그래프에 연결한다(재추출만, Drive 재호출 없음).
$('driveSyncKnowledge').onclick = async () => {
  openPanel('Drive 지식그래프 동기화')
  $('panelBody').innerHTML = `
    <p style="font-size:13px;color:var(--muted);margin-bottom:10px">이미 가져온 Google Drive·Tiro 문서 중 아직 지식그래프에 연결되지 않은 것들을 다시 추출해요.</p>
    <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:10px">
      <input type="checkbox" id="driveSyncForce"> 이미 연결된 문서도 다시 추출 (추출 규칙이 바뀌었을 때 — AI 호출이 문서 수만큼 발생해요)
    </label>
    <button id="driveSyncStart" style="padding:6px 14px;border:none;background:var(--accent, #2E75CC);color:#fff;border-radius:5px">동기화 시작</button>
    <span id="driveSyncMsg" style="font-size:12px;color:var(--muted);margin-left:8px"></span>
  `
  $('driveSyncStart').onclick = startDriveKnowledgeSync
}
let driveSyncPollTimer = null
async function startDriveKnowledgeSync() {
  const btn = $('driveSyncStart'), msg = $('driveSyncMsg')
  btn.disabled = true; btn.textContent = '동기화 중…'
  try {
    const force = $('driveSyncForce') && $('driveSyncForce').checked
    await api('POST', '/api/integrations/drive/sync-knowledge' + (force ? '?force=true' : ''), {})
    pollDriveKnowledgeSync()
  } catch (e) { btn.disabled = false; btn.textContent = '동기화 시작'; msg.textContent = e.message }
}
function pollDriveKnowledgeSync() {
  clearTimeout(driveSyncPollTimer)
  driveSyncPollTimer = setTimeout(async () => {
    const btn = $('driveSyncStart'), msg = $('driveSyncMsg')
    try {
      const j = await api('GET', '/api/integrations/drive/import/status')
      if (j.status === 'RUNNING') {
        if (msg) msg.textContent = `진행 중 ${j.processed}/${j.found}… ${j.currentDoc ? '(' + j.currentDoc + ')' : ''}`
        pollDriveKnowledgeSync()
        return
      }
      if (msg) {
        msg.textContent = j.status === 'FAILED'
            ? `실패: ${j.error || '알 수 없는 오류'}`
            : `완료: ${j.found}개 중 새로 연결 ${j.documented}건, 건너뜀 ${j.skippedDuplicate}개, 실패 ${j.failed}개.`
      }
      if (btn) { btn.disabled = false; btn.textContent = '동기화 시작' }
    } catch { pollDriveKnowledgeSync() /* 일시적 네트워크 오류면 계속 폴링 */ }
  }, 2000)
}

// ---------- search ----------
let searchTimer = null
$('search').addEventListener('input', e => {
  clearTimeout(searchTimer)
  const query = e.target.value.trim()
  if (!query) { $('searchResults').style.display = 'none'; return }
  searchTimer = setTimeout(async () => {
    // 검색 API 실패를 "결과 없음"으로 위장하지 않는다 — 에러는 에러로 보여준다
    const r = await api('GET', `/api/search?q=${encodeURIComponent(query)}&limit=8`).catch(() => null)
    const box = $('searchResults')
    if (!r) {
      box.innerHTML = '<div class="hit" style="color:var(--muted)">검색에 실패했어요 — 서버 연결을 확인해 주세요</div>'
      box.style.display = 'block'
      return
    }
    box.innerHTML = r.hits.map(h =>
      `<div class="hit" data-doc="${h.documentId}"><div class="path">${esc(h.headingPath || h.title)}</div>${esc(h.snippet || '').slice(0, 120)}</div>`
    ).join('') || '<div class="hit" style="color:var(--muted)">결과가 없어요</div>'
    box.style.display = 'block'
    box.querySelectorAll('[data-doc]').forEach(el => el.onclick = () => { box.style.display = 'none'; $('search').value = ''; openDoc(el.dataset.doc) })
  }, 250)
})
document.addEventListener('click', e => { if (!$('searchWrap').contains(e.target)) $('searchResults').style.display = 'none' })

// ---------- boot ----------
if (memberId) tryLogin(memberId).catch(() => { localStorage.removeItem('mydoc.memberId'); memberId = '' })
</script>
</body>
</html>
