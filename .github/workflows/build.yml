name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Testcontainers acceptance tests (M0~M7) run against Docker on the runner.
      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: editing-plane syntax check
        run: |
          node --check editing-plane/server.js
          node --check editing-plane/compaction.js

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7
