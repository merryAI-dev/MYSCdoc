# Local development only. Matches the loopback-only bootstrap guard.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: myscdoc_marine
      POSTGRES_USER: mydoc
      POSTGRES_PASSWORD: marine-local-only
    ports:
      - "127.0.0.1:55436:5432"
    volumes:
      - muse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mydoc -d myscdoc_marine"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  muse-postgres:
