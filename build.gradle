plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.mysc'
version = '0.0.1-SNAPSHOT'

ext['testcontainers.version'] = '2.0.5'
ext['slackSdk.version'] = '1.49.0'
ext['mcpSdk.version'] = '2.0.0'
ext['springdoc.version'] = '2.5.0'
ext['googlePubsub.version'] = '1.151.0'
ext['googleAuth.version'] = '1.48.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation "org.hibernate.orm:hibernate-vector:${dependencyManagement.managedVersions['org.hibernate.orm:hibernate-core']}"
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${property('springdoc.version')}"
    implementation "com.slack.api:bolt-socket-mode:${property('slackSdk.version')}"
    implementation "com.slack.api:slack-api-client:${property('slackSdk.version')}"
    runtimeOnly 'org.glassfish.tyrus.bundles:tyrus-standalone-client:1.20'
    implementation "io.modelcontextprotocol.sdk:mcp-core:${property('mcpSdk.version')}"
    implementation "io.modelcontextprotocol.sdk:mcp-json-jackson2:${property('mcpSdk.version')}"
    implementation "com.google.cloud:google-cloud-pubsub:${property('googlePubsub.version')}"
    implementation "com.google.auth:google-auth-library-oauth2-http:${property('googleAuth.version')}"
    runtimeOnly 'org.postgresql:postgresql'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
}

tasks.named('test') {
    useJUnitPlatform()
}
